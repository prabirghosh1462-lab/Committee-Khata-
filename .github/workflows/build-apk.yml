name: Build Web-to-APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Webview Android Project
        run: |
          npm install -g capacitor-cli
          mkdir -p android-build
          cd android-build
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Committee Khata" "committee.khata" --web-dir www
          mkdir -p www
          cp -r ../* www/ 2>/dev/null || true
          npx cap add android
          if [ -f ../google-services.json ]; then
            cp ../google-services.json android/app/
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: committee-khata-apk
          path: android-build/android/app/build/outputs/apk/debug/app-debug.apk
