name: Build APK Simple

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Webview APK
        uses: GearS3/Webview-App-Action@v1.2
        with:
          app-name: 'Committee Khata'
          package-name: 'committee.khata'
          website-url: ''
          path-to-html: '.'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: committee-khata-apk
          path: '**/*.apk'
          
