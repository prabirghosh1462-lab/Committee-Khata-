name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Cordova and Build APK
        run: |
          npm install -g cordova
          cordova create myApp com.committee.khata "Committee Khata"
          cd myApp
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          rm -rf www/myApp
          cordova platform add android
          if [ -f ../google-services.json ]; then
            cp ../google-services.json platforms/android/app/
          fi
          cordova build android --nogradle

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: committee-khata-apk
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
