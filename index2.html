<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4a1740">
<title>শ্রী শ্রী মহা চক্র রাস পূজা কমিটি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --night:#2b1250;
  --maroon:#8c1c3f;
  --marigold:#f5a623;
  --cream:#fdf8f0;
  --ink:#2a1441;
  --good:#1f8a4c;
  --bad:#c23652;
}

body{margin:0;font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;background:var(--cream);color:var(--ink)}
.app{max-width:480px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 25px #0002}
header{background:linear-gradient(150deg,var(--night),var(--maroon));color:white;padding:22px 18px 30px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center}
.title{text-align:center;font-family:'Baloo Da 2',sans-serif;font-size:24px;font-weight:800;margin-top:10px}
.sub{text-align:center;color:var(--marigold);font-size:15px;font-weight:600}
.container{padding:16px}

textarea,select,input{width:100%;padding:13px;border:1.5px solid #e8e0d8;border-radius:12px;margin-bottom:12px;font-size:15px;font-family:inherit;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--marigold);box-shadow:0 0 0 3px rgba(245,166,35,.16)}

.primary{border:0;border-radius:13px;padding:14px;background:linear-gradient(135deg,var(--night),var(--maroon));color:white;font-size:16px;font-weight:700;font-family:'Baloo Da 2',sans-serif;cursor:pointer;width:100%}
.item{background:#fff;border-radius:16px;padding:14px;margin-bottom:11px;box-shadow:0 4px 14px rgba(43,18,80,.07);border-left:5px solid var(--maroon)}
.item h3{margin:0 0 5px;font-family:'Baloo Da 2',sans-serif;font-size:16px}
.item p{margin:4px 0;color:#666;font-size:14px}

/* Login Screen */
#loginScreen{position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#f0f2f5 0%,#dfe7f4 100%);display:flex;align-items:center;justify-content:center;padding:22px}
.login-wrap{width:min(430px,100%);text-align:center}
.login-title{font-family:'Baloo Da 2',sans-serif;font-size:26px;font-weight:800;color:#7f1747;margin-bottom:15px}
.login-card{background:#fff;border-radius:18px;padding:24px 22px;box-shadow:0 12px 35px rgba(0,0,0,.14);text-align:left}
.login-btn{width:100%;border:0;border-radius:11px;padding:13px;background:#1877f2;color:#fff;font-size:17px;font-weight:800;font-family:'Baloo Da 2',sans-serif;cursor:pointer;margin-top:6px}

@media (min-width: 769px){
  .app{max-width:900px;min-height:100vh}
  .container{padding:26px 34px}
}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen">
  <div class="login-wrap">
    <div class="login-title">শ্রী শ্রী মহা চক্র রাস পূজা কমিটি</div>
    <div class="login-card">
      <h2 style="text-align:center;margin-top:0;">কমিটি প্রবেশদ্বার</h2>
      <input type="text" id="loginUsername" placeholder="ইউজারনেম বা মোবাইল নম্বর">
      <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড">
      <button class="login-btn" id="loginBtn">প্রবেশ করুন</button>
      <div id="loginError" style="color:red; text-align:center; margin-top:8px; font-weight:bold;"></div>
    </div>
  </div>
</div>

<!-- Main App -->
<div class="app" id="mainApp" style="display:none;">
  <header>
    <div class="top">
      <span style="font-weight: bold;">কমিটি খাতা অনলাইন</span>
      <button id="logoutBtn" style="background:#c62828; color:#fff; border:0; padding:6px 12px; border-radius:8px; cursor:pointer;">লগআউট</button>
    </div>
    <div class="title">শ্রী শ্রী মহা চক্র রাস পূজা কমিটি</div>
    <div class="sub">অনলাইন ক্যাশ ও কালেকশন বুক</div>
  </header>

  <div class="container">
    <h3>নতুন লেনদেন যোগ করুন</h3>
    <form id="ledgerForm">
      <input type="text" id="memberName" placeholder="সদস্য/দাতার নাম (বাধ্যতামূলক)" required>
      <input type="number" id="amount" placeholder="টাকার পরিমাণ (৳)" required>
      <select id="type">
        <option value="জমা">জমা (Income)</option>
        <option value="খরচ">খরচ (Expense)</option>
      </select>
      <input type="text" id="note" placeholder="বিবরণ / নোট">
      <button type="submit" class="primary">ডাটাবেসে সেভ করুন</button>
    </form>

    <hr style="margin:25px 0; border:0; border-top:1px solid #ddd;">

    <h3>অনলাইন হিসেব তালিকা (সব ফোনে লাইভ সিঙ্ক)</h3>
    <div id="ledgerList">
      <p style="text-align: center; color: #777;">ডাটা লোড হচ্ছে...</p>
    </div>
  </div>
</div>

<!-- Firebase Modular SDK & App Logic -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    deleteDoc, 
    doc, 
    onSnapshot, 
    query, 
    orderBy, 
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC5n7tqHqaJRIX5vM-pRdlJeCfsTMEg",
    authDomain: "committee-khata-web.firebaseapp.com",
    databaseURL: "https://committee-khata-web-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "committee-khata-web",
    storageBucket: "committee-khata-web.firebasestorage.app",
    messagingSenderId: "22564988065",
    appId: "1:22564988065:web:0a3996aa8b5decd0cfce0",
    measurementId: "G-8ZX8YD7H1T"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const loginScreen = document.getElementById("loginScreen");
  const mainApp = document.getElementById("mainApp");
  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const loginError = document.getElementById("loginError");
  const ledgerForm = document.getElementById("ledgerForm");
  const ledgerList = document.getElementById("ledgerList");

  loginBtn.addEventListener("click", () => {
    const user = document.getElementById("loginUsername").value.trim();
    const pass = document.getElementById("loginPassword").value.trim();

    if (user !== "" && pass !== "") {
      loginScreen.style.display = "none";
      mainApp.style.display = "block";
      loadFirestoreData();
    } else {
      loginError.innerText = "ইউজারনেম এবং পাসওয়ার্ড পূরণ করুন!";
    }
  });

  logoutBtn.addEventListener("click", () => {
    mainApp.style.display = "none";
    loginScreen.style.display = "flex";
  });

  ledgerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("memberName").value.trim();
    const amount = Number(document.getElementById("amount").value);
    const type = document.getElementById("type").value;
    const note = document.getElementById("note").value.trim();

    try {
      await addDoc(collection(db, "transactions"), {
        name: name,
        amount: amount,
        type: type,
        note: note,
        timestamp: serverTimestamp()
      });
      ledgerForm.reset();
    } catch (err) {
      alert("ডাটা সেভ করতে সমস্যা হয়েছে! ইন্টারনেট কানেকশন চেক করুন।");
    }
  });

  function loadFirestoreData() {
    const q = query(collection(db, "transactions"), orderBy("timestamp", "desc"));
    
    onSnapshot(q, (snapshot) => {
      ledgerList.innerHTML = "";
      if (snapshot.empty) {
        ledgerList.innerHTML = "<p style='text-align:center;'>কোনো জমা-খরচের হিসেব পাওয়া যায়নি।</p>";
        return;
      }

      snapshot.forEach((documentSnap) => {
        const data = documentSnap.data();
        const docId = documentSnap.id;

        const item = document.createElement("div");
        item.className = "item";
        item.style.borderLeftColor = data.type === "জমা" ? "var(--good)" : "var(--bad)";

        item.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>${data.name}</h3>
            <b style="color:${data.type === 'জমা' ? 'var(--good)' : 'var(--bad)'}; font-size:16px;">
              ${data.type === 'জমা' ? '+' : '-'} ৳${data.amount}
            </b>
          </div>
          <p>প্রকার: <b>${data.type}</b> ${data.note ? '| ' + data.note : ''}</p>
          <button style="background:#ffe7e7; color:#b71c1c; border:0; padding:4px 8px; border-radius:6px; cursor:pointer; font-size:12px; margin-top:5px;" onclick="deleteTransaction('${docId}')">মুছে ফেলুন</button>
        `;
        ledgerList.appendChild(item);
      });
    });
  }

  window.deleteTransaction = async (id) => {
    if (confirm("আপনি কি এই এনট্রিটি মুছে ফেলতে চান?")) {
      await deleteDoc(doc(db, "transactions", id));
    }
  };
</script>
</body>
</html>
