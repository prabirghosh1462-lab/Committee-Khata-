<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Committee Khata Web</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
    h2 { color: #333; }
    input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { background-color: #0288d1; color: white; padding: 10px 15px; border: none; cursor: pointer; width: 100%; }
    button:hover { background-color: #01579b; }
    ul { list-style-type: none; padding: 0; }
    li { background: #f4f4f4; margin: 5px 0; padding: 10px; border-left: 5px solid #0288d1; }
  </style>
</head>
<body>

  <h2>Committee Khata</h2>
  
  <div>
    <input type="text" id="memberName" placeholder="সদস্যের নাম লিখুন">
    <input type="number" id="amount" placeholder="টাকার পরিমাণ">
    <button id="saveBtn">ডাটাবেসে সেভ করুন</button>
  </div>

  <h3>সদস্যদের তালিকা:</h3>
  <ul id="memberList"></ul>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ১. আপনার Firebase কনফিগারেশন (Firebase Console থেকে পাওয়া কোডটি দিয়ে পরিবর্তন করুন)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "committee-khata-web.firebaseapp.com",
      projectId: "committee-khata-web",
      storageBucket: "committee-khata-web.appspot.com",
      messagingSenderId: "22564988065",
      appId: "YOUR_APP_ID"
    };

    // Firebase ইনিশিয়ালাইজেশন
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const memberNameInput = document.getElementById('memberName');
    const amountInput = document.getElementById('amount');
    const saveBtn = document.getElementById('saveBtn');
    const memberList = document.getElementById('memberList');

    // ২. ডাটাবেসে ডাটা যুক্ত করার ফংশন (Create/Write)
    saveBtn.addEventListener('click', async () => {
      const name = memberNameInput.value;
      const amount = amountInput.value;

      if (name === "" || amount === "") {
        alert("সবগুলো ঘর পূরণ করুন!");
        return;
      }

      try {
        await addDoc(collection(db, "members"), {
          name: name,
          amount: Number(amount),
          createdAt: new Date()
        });
        alert("ডাটা সফলভাবে সেভ হয়েছে!");
        memberNameInput.value = "";
        amountInput.value = "";
        loadData(); // তালিকা রিফ্রেশ করুন
      } catch (e) {
        console.error("Error adding document: ", e);
      }
    });

    // ৩. ডাটাবেস থেকে ডাটা পড়ার ফংশন (Read)
    async function loadData() {
      memberList.innerHTML = "";
      const querySnapshot = await getDocs(collection(db, "members"));
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const li = document.createElement('li');
        li.textContent = `${data.name} - ৳${data.amount}`;
        memberList.appendChild(li);
      });
    }

    // পেজ লোড হলে ডাটা দেখাবে
    loadData();
  </script>
</body>
</html>
